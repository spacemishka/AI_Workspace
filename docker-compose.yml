# =============================================================================
# AI Workspace — Docker Compose
#
# Prerequisites (Windows):
#   - Docker Desktop with WSL2 backend
#   - NVIDIA Container Toolkit (for Ollama GPU support)
#   - Copy .env.example to .env and fill in required values
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose up -d postgres redis qdrant ollama  # infra only (dev mode)
#   docker compose logs -f backend    # tail a service log
#   docker compose down -v            # stop and remove volumes
# =============================================================================

name: ai-workspace

services:

  # ============================================================================
  # Infrastructure
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworkspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aiworkspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiworkspace} -d ${POSTGRES_DB:-aiworkspace}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: ai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__ENABLE_TLS: "false"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h" # keep models loaded in VRAM
      OLLAMA_NUM_PARALLEL: "2" # max concurrent inference requests
      OLLAMA_MAX_LOADED_MODELS: "2" # fit within 8 GB VRAM budget
    volumes:
      - ollama_data:/root/.ollama # persists downloaded models
    ports:
      - "11434:11434"
    # GPU passthrough — requires NVIDIA Container Toolkit + WSL2 on Windows
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai-network

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ai-llamacpp
    restart: unless-stopped
    volumes:
      - ./models:/models  # place your .gguf files here before starting
    # Use YAML list format — inline comments break the folded > syntax
    command:
      - --model
      - /models/llama-3.1-8b-q4_k_m.gguf   # update filename to match your download
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --n-gpu-layers
      - "33"       # full offload for 7B Q4 on RTX 3070 Ti; reduce if OOM
      - --ctx-size
      - "8192"
      - --parallel
      - "2"
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - ai-network

  # ============================================================================
  # Application Services
  # ============================================================================


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiworkspace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiworkspace}
      # Cache & Queue
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Vector Store
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # Local Inference
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Cloud Provider (OpenRouter — pluggable)
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      # Observability
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    volumes:
      - ./backend:/app # hot reload in development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - ai-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai-worker
    restart: unless-stopped
    command: [ "python", "-m", "arq", "src.workers.main.WorkerSettings" ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiworkspace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiworkspace}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ai-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    volumes:
      - ./frontend:/app # hot reload in development
      - /app/node_modules # preserve container node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ai-network

  # ============================================================================
  # Observability
  # ============================================================================

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiworkspace}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      TELEMETRY_ENABLED: "false" # no external telemetry — privacy-first
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000/api/public/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ai-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ai-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ai-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - ai-network

# ==============================================================================
# Volumes
# ==============================================================================

volumes:
  postgres_data:
    name: ai-workspace-postgres
  redis_data:
    name: ai-workspace-redis
  qdrant_data:
    name: ai-workspace-qdrant
  ollama_data:
    name: ai-workspace-ollama
  prometheus_data:
    name: ai-workspace-prometheus
  grafana_data:
    name: ai-workspace-grafana

# ==============================================================================
# Networks
# ==============================================================================

networks:
  ai-network:
    name: ai-workspace-network
    driver: bridge
