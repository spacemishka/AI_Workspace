[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workspace-backend"
version = "0.1.0"
description = "Backend for Local AI Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API & Async Server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache & Task Queue
    "redis>=5.0.0",
    "arq>=0.25.0",

    # AI & Orchestration
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",

    # Security & Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # Observability & Metrics
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
