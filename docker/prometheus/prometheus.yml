global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ai-workspace

scrape_configs:

  # FastAPI backend metrics endpoint
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Redis exporter (add redis-exporter service to compose if needed)
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Qdrant native metrics
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics
    scrape_interval: 30s
